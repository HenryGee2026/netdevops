---
- name: Validate Cisco Router Hostname
  hosts: ios
  gather_facts: false

  tasks:
    - name: Gather active network facts from the router
      cisco.ios.ios_facts:
        gather_subset: min

    - name: Fail if the current hostname does not match the inventory name
      ansible.builtin.fail:
        msg: "Validation FAILED! Expected '{{ inventory_hostname }}' but the router reports '{{ ansible_net_hostname }}'."
      when: ansible_net_hostname != inventory_hostname

    - name: Log successful validation
      ansible.builtin.debug:
        msg: "Validation PASSED! The router successfully updated its hostname to '{{ ansible_net_hostname }}'."